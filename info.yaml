# Tiny Tapeout project information
project:
  title: "ProtoEmu"
  author: "Oliver Klug"
  discord: ""
  description: "Reprogrammable protocol-emulator pin machine (two identical SMs)"
  language: "Verilog"
  clock_hz: 12000000

  # Jane Street contest: 8x4. Template comment lists only up to 8x2;
  # tt-support-tools ihp-sg13g2 tile_sizes.yaml has 8x4 at 1724.16 x 710.64 um.
  tiles: "8x4"

  top_module: "tt_um_klug_protoemu"

  source_files:
    - "project.v"
    - "protoemu_core.v"
    - "sm.v"
    - "fifo4.v"
    - "clkdiv.v"
    - "sram_flop.v"

pinout:
  ui[0]: "host_nibble[0]"
  ui[1]: "host_nibble[1]"
  ui[2]: "host_nibble[2]"
  ui[3]: "host_nibble[3]"
  ui[4]: "host_cmd[0]"
  ui[5]: "host_cmd[1]"
  ui[6]: "host_cmd[2]"
  ui[7]: "host_strobe"
  uo[0]: "peek[0]"
  uo[1]: "peek[1]"
  uo[2]: "peek[2]"
  uo[3]: "peek[3]"
  uo[4]: "peek[4]"
  uo[5]: "peek[5]"
  uo[6]: "peek[6]"
  uo[7]: "peek[7]"
  uio[0]: "PIN0"
  uio[1]: "PIN1"
  uio[2]: "PIN2"
  uio[3]: "PIN3"
  uio[4]: "PIN4"
  uio[5]: "PIN5"
  uio[6]: "PIN6"
  uio[7]: "PIN7"

yaml_version: 6
